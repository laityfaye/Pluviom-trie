# docker/timescaledb/postgresql.conf
# Configuration PostgreSQL optimisée pour TimescaleDB
# Projet : Prédiction d'événements climatiques extrêmes au Sénégal

# ============================================================================
# CONNEXIONS ET AUTHENTIFICATION
# ============================================================================
listen_addresses = '*'
port = 5432
max_connections = 200
shared_buffers = 1GB                    # 25% de la RAM disponible
effective_cache_size = 3GB              # 75% de la RAM disponible
maintenance_work_mem = 256MB

# ============================================================================
# MÉMOIRE ET CACHE
# ============================================================================
work_mem = 64MB                         # Pour les opérations de tri/hash
shared_preload_libraries = 'timescaledb,pg_stat_statements'
timescaledb.max_background_workers = 8

# ============================================================================
# OPTIMISATIONS TIMESCALEDB
# ============================================================================
# Configuration spécifique pour les séries temporelles
timescaledb.telemetry_level = off
timescaledb.max_parallel_workers_per_gather = 4
timescaledb.enable_parallel_aggregation = on
timescaledb.enable_optimizations = on

# ============================================================================
# ÉCRITURE ET WAL (Write-Ahead Logging)
# ============================================================================
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 1GB

# ============================================================================
# PERFORMANCE DES REQUÊTES
# ============================================================================
random_page_cost = 1.1                 # SSD optimized
effective_io_concurrency = 200         # SSD concurrent I/O
default_statistics_target = 100
constraint_exclusion = partition

# ============================================================================
# PARALLÉLISME
# ============================================================================
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# ============================================================================
# LOGGING ET MONITORING
# ============================================================================
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000      # Log queries > 1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Extensions statistiques
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# ============================================================================
# OPTIMISATIONS SPÉCIFIQUES CLIMAT
# ============================================================================
# Pour les agrégations temporelles fréquentes
enable_hashagg = on
enable_sort = on
enable_material = on

# Optimisation pour les jointures géographiques
geqo = on
geqo_threshold = 12

# ============================================================================
# SÉCURITÉ
# ============================================================================
ssl = off                              # À activer en production
password_encryption = scram-sha-256

# ============================================================================
# AUTRES OPTIMISATIONS
# ============================================================================
# Réduction de la latence
synchronous_commit = off               # Acceptable pour données climatiques
wal_writer_delay = 200ms
commit_delay = 100

# Cache des plans d'exécution
plan_cache_mode = auto

# Configuration locale
timezone = 'Africa/Dakar'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'